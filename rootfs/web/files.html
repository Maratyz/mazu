<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mazu Files</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="main">
  <div class="page-header">
    <h1>File Browser</h1>
  </div>

  <div class="page-content">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Type</th></tr></thead>
        <tbody id="file-body"></tbody>
      </table>
    </div>
    <pre id="file-view" style="display:none;background:var(--bg-alt);border:1px solid var(--border);border-radius:6px;padding:14px;overflow:auto;max-height:50vh;font-size:13px;color:var(--fg)"></pre>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/files.js"></script>
</body>
</html>
