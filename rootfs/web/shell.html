<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mazu Shell</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="main">
  <div class="page-header">
    <div class="status-dot connecting" id="status-dot"></div>
    <h1>Shell</h1>
    <span id="status-text" style="font-size:12px;color:#8b949e">connecting</span>
    <span id="session-id" style="margin-left:auto;font-size:11px;color:#484f58"></span>
  </div>

  <div class="term-output" id="output"></div>

  <div class="term-input-row">
    <span class="term-prompt">mazu$</span>
    <input class="term-input" id="cmd-input" type="text" autocomplete="off"
           spellcheck="false" placeholder="type a command and press Enter">
    <button class="btn" id="send-btn">Send</button>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/shell.js"></script>
</body>
</html>
